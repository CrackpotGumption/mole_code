<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400"><style>text{font-family:Arial,sans-serif}</style><rect width="1900" height="1400" fill="white"/><text x="55" y="55" font-size="33" fill="#263744" text-anchor="start">06 — Mega, I²C bus and Start switch</text><text x="55" y="95" font-size="20" fill="#263744" text-anchor="start">Individual pin connections. The Mega receives power and serial through USB from the host.</text><text x="55" y="1374" font-size="16" fill="#687985" text-anchor="start">REVIEW • dimensions/positions schematic • same net name = same wire network • dots = junctions • © 2026 crackpotgumption / CC BY 4.0</text><rect x="80" y="140" width="430" height="70" rx="5" fill="#f4f7f9" stroke="#526b7a" stroke-width="2"/><text x="100" y="185" font-size="23" fill="#263744" text-anchor="start">Host computer USB power + serial</text><polyline points="280,210 280,260" fill="none" stroke="#526b7a" stroke-width="3" /><rect x="100" y="260" width="400" height="1000" rx="5" fill="#f4f7f9" stroke="#526b7a" stroke-width="2"/><text x="125" y="305" font-size="26" fill="#263744" text-anchor="start">ARDUINO MEGA 2560</text><text x="125" y="340" font-size="18" fill="#263744" text-anchor="start">USB connector</text><rect x="1110" y="250" width="570" height="330" rx="5" fill="#f4f7f9" stroke="#526b7a" stroke-width="2"/><text x="1130" y="290" font-size="25" fill="#263744" text-anchor="start">ADAFRUIT #6318 — I²C / logic</text><text x="1130" y="325" font-size="20" fill="#263744" text-anchor="start">Address 0x20</text><rect x="1110" y="680" width="570" height="330" rx="5" fill="#f4f7f9" stroke="#526b7a" stroke-width="2"/><text x="1130" y="720" font-size="25" fill="#263744" text-anchor="start">TCA9548A — upstream I²C</text><text x="1130" y="755" font-size="20" fill="#263744" text-anchor="start">Address 0x70; channels on sheet 07</text><polyline points="500,400 1110,400" fill="none" stroke="#286e99" stroke-width="3" /><polyline points="500,46