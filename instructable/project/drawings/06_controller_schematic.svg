ke-width="3" /><text x="580" y="627" font-size="19" fill="#303840" text-anchor="start">DC_GND</text><circle cx="1680" cy="380" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="1680,380 1760,380" fill="none" stroke="#be4b35" stroke-width="3" /><text x="1750" y="355" font-size="20" fill="#263744" text-anchor="start">Vcc</text><text x="1760" y="415" font-size="18" fill="#be4b35" text-anchor="end">DEDICATED_5V</text><circle cx="1680" cy="510" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="1680,510 1760,510" fill="none" stroke="#303840" stroke-width="3" /><polyline points="1760,510 1760,528" fill="none" stroke="#303840" stroke-width="3" /><polyline points="1742,528 1778,528" fill="none" stroke="#303840" stroke-width="3" /><polyline points="1749,535 1771,535" fill="none" stroke="#303840" stroke-width="3" /><polyline points="1756,542 1764,542" fill="none" stroke="#303840" stroke-width="3" /><text x="1655" y="517" font-size="20" fill="#263744" text-anchor="end">GND</text><text x="1760" y="565" font-size="18" fill="#303840" text-anchor="end">DC_GND</text><circle cx="1680" cy="810" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="1680,810 1790,810" fill="none" stroke="#be4b35" stroke-width="3" /><text x="1655" y="817" font-size="20" fill="#263744" text-anchor="end">VCC / VIN</text><text x="1810" y="790" font-size="17" fill="#be4b35" text-anchor="end">DEDICATED_5V</text><circle cx="1680" cy="940" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="1680,940 1760,940" fill="none" stroke="#303840" stroke-width="3" /><polyline points="1760,940 1760,958" fill="none" stroke="#303840" stroke-width="3" /><polyline points="1742,958 1778,958" fill="none" stroke="#303840" stroke-width="3" /><polyline points="1749,965 1771,965" fill="none" stroke="#303840" stroke-width="3" /><polyline points="1756,972 1764,972" fill="none" stroke="#303840" stroke-width="3" /><text x="1655" y="947" font-size="20" fill="#263744" text-anchor="end">GND</text><text x="1760" y="995" font-size="18" fill="#303840" text-anchor="end">DC_GND</text><text x="480" y="713" font-size="22" fill="#263744" text-anchor="end">D24</text><circle cx="500" cy="705" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="500,705 625,705" fill="none" stroke="#6c4b87" stroke-width="3" /><circle cx="625" cy="705" r="5" fill="white" stroke="#263744" stroke-width="2"/><circle cx="720" cy="705" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="625,705 702,675" fill="none" stroke="#303840" stroke-width="3" /><polyline points="720,705 740,705 740,765" fill="none" stroke="#303840" stroke-width="3" /><polyline points="740,765 740,783" fill="none" stroke="#303840" stroke-width="3" /><polyline points="722,783 758,783" fill="none" stroke="#303840" stroke-width="3" /><polyline points="729,790 751,790" fill="none" stroke="#303840" stroke-width="3" /><polyline points="736,797 744,797" fill="none" stroke="#303840" stroke-width="3" /><text x="600" y="660" font-size="20" fill="#263744" text-anchor="start">START — normally open</text><text x="125" y="750" font-size="18" fill="#263744" text-anchor="start">pinMode(D24, INPUT_PULLUP)</text><text x="600" y="825" font-size="18" fill="#303840" text-anchor="start">DC_GND</text><text x="480" y="907" font-size="22" fill="#263744" text-anchor="end">D14</text><circle cx="500" cy="900" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="500,900 570,900" fill="none" stroke="#6c4b87" stroke-width="3" /><text x="580" y="907" font-size="19" fill="#6c4b87" text-anchor="start">LED0_DATA</text><text x="480" y="972" font-size="22" fill="#263744" text-anchor="end">D15</text><circle cx="500" cy="965" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="500,965 570,965" fill="none" stroke="#6c4b87" stroke-width="3" /><text x="580" y="972" font-size="19" fill="#6c4b87" text-anchor="start">LED1_DATA</text><text x="480" y="1037" font-size="22" fill="#263744" text-anchor="end">D16</text><circle cx="500" cy="1030" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="500,1030 570,1030" fill="none" stroke="#6c4b87" stroke-width="3" /><text x="580" y="1037" font-size="19" fill="#6c4b87" text-anchor="start">LED2_DATA</text><text x="480" y="1102" font-size="22" fill="#263744" text-anchor="end">D17</text><circle cx="500" cy="1095" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="500,1095 570,1095" fill="none" stroke="#6c4b87" stroke-width="3" /><text x="580" y="1102" font-size="19" fill="#6c4b87" text-anchor="start">LED3_DATA</text><text x="480" y="1167" font-size="22" fill="#263744" text-anchor="end">D18</text><circle cx="500" cy="1160" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="500,1160 570,1160" fill="none" stroke="#6c4b87" stroke-width="3" /><text x="580" y="1167" font-size="19" fill="#6c4b87" text-anchor="start">LED4_DATA</text><text x="900" y="1120" font-size="22" fill="#263744" text-anchor="start">LED0_DATA … LED4_DATA continue to the collar DIN pins on sheet 07.</text><text x="900" y="1160" font-size="22" fill="#263744" text-anchor="start">Driver coil power and switched outputs are drawn on sheet 08.</text><text x="900" y="1210" font-size="20" fill="#263744" text-anchor="start">Driver Vcc and mux VCC / VIN use the dedicated 5 V supply, not the Mega 5 V pin.</text><text x="900" y="1245" font-size="20" fill="#263744" text-anchor="start">DEDICATED_5V is the same supply rail drawn on sheet 07.</text></svg>