<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><style>text{font-family:Arial,sans-serif} .dim{marker-start:url(#arrow);marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38566d"/></marker></defs><rect width="1600" height="1200" fill="white"/><text x="60" y="65" font-size="34" fill="#243342" text-anchor="start">03 — Bottom setback and panel relationship</text><text x="60" y="105" font-size="19" fill="#243342" text-anchor="start">Side section schematic, viewed from the cabinet side. Front is left; rear is right. Framing and trim omitted.</text><text x="60" y="1170" font-size="17" fill="#697681" text-anchor="start">REVIEW DRAWING • 2026-10-14 • dimensions in inches • ¾-inch plywood • not a full-size drilling template</text><rect x="270" y="265" width="528" height="792" fill="#f8fafb" stroke="#bcc7ce" stroke-width="2" /><rect x="270" y="265" width="528" height="16.5" fill="#c6dce7" stroke="#38566d" stroke-width="2" /><rect x="270" y="281.5" width="16.5" height="775.5" fill="#efcfad" stroke="#a97341" stroke-width="2" /><rect x="286.5" y="1040.5" width="511.5" height="16.5" fill="#c6dce7" stroke="#38566d" stroke-width="2" /><line x1="270" y1="230" x2="798" y2="230" stroke="#38566d" stroke-width="2" class="dim"/><text x="534" y="220" font-size="19" fill="#243342" text-anchor="middle">24 overall side depth</text><line x1="225" y1="265" x2="225" y2="1057" stroke="#38566d" stroke-width="2" class="dim"/><text x="213" y="661" font-size="19" fill="#243342" text-anchor="end">36 side height</text><line x1="286.5" y1="1097" x2="798" y2="1097" stroke="#38566d" stroke-width="2" class="dim"/><text x="542.25" y="1087" font-size="19" fill="#243342" text-anchor="middle">23.25 bottom depth</text><text x="900" y="325" font-size="23" fill="#243342" text-anchor="start">TOP: 36 wide × 24 deep × ¾ thick</text><text x="900" y="375" font-size="23" fill="#243342" text-anchor="start">FRONT: 36 wide × 35.25 tall × ¾ thick</text><text x="900" y="425" font-size="23" fill="#243342" text-anchor="start">BOTTOM: 36 wide × 23.25 deep × ¾ thick</text><text x="900" y="510" font-size="22" fill="#243342" text-anchor="start">The front drops below the top panel</text><text x="900" y="545" font-size="22" fill="#243342" text-anchor="start">to align with the side-panel bottoms.</text><text x="900" y="615" font-size="22" fill="#243342" text-anchor="start">The bottom starts ¾ inch back from</text><text x="900" y="650" font-size="22" fill="#243342" text-anchor="start">the front edge, allowing the front panel</text><text x="900" y="685" font-size="22" fill="#243342" text-anchor="start">to occupy that space.</text><text x="900" y="770" font-size="21" fill="#243342" text-anchor="start">Front and bottom share a bottom datum.</text><text x="900" y="815" font-size="19" fill="#243342" text-anchor="start">Schematic confirms the supplied panel</text><text x="900" y="845" font-size="19" fill="#243342" text-anchor="start">dimensions; joint details are for review.</text><text x="900" y="930" font-size="23" fill="#243342" text-anchor="start">Outside width: 37.5</text><text x="900" y="970" font-size="19" fill="#243342" text-anchor="start">36-inch panels between two ¾-inch sides.</text></svg>