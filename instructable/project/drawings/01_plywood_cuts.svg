<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><style>text{font-family:Arial,sans-serif} .dim{marker-start:url(#arrow);marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38566d"/></marker></defs><rect width="1600" height="1200" fill="white"/><text x="60" y="65" font-size="34" fill="#243342" text-anchor="start">01 — Plywood cuts and two-sheet layout</text><text x="60" y="105" font-size="19" fill="#243342" text-anchor="start">Proposed cutting sequence from confirmed panel dimensions. Sheet layouts include a ⅛-inch kerf between row blanks.</text><text x="60" y="1170" font-size="17" fill="#697681" text-anchor="start">REVIEW DRAWING • 2026-10-14 • dimensions in inches • ¾-inch plywood • not a full-size drilling template</text><text x="60" y="160" font-size="24" fill="#243342" text-anchor="start">CUT LIST — seven panels</text><text x="60" y="205" font-size="22" fill="#243342" text-anchor="start">Sides</text><text x="285" y="205" font-size="22" fill="#243342" text-anchor="start">× 2</text><text x="365" y="205" font-size="22" fill="#243342" text-anchor="start">24 deep × 36 high</text><text x="60" y="249" font-size="22" fill="#243342" text-anchor="start">Top / playfield</text><text x="285" y="249" font-size="22" fill="#243342" text-anchor="start">× 1</text><text x="365" y="249" font-size="22" fill="#243342" text-anchor="start">36 wide × 24 deep</text><text x="60" y="293" font-size="22" fill="#243342" text-anchor="start">Bottom</text><text x="285" y="293" font-size="22" fill="#243342" text-anchor="start">× 1</text><text x="365" y="293" font-size="22" fill="#243342" text-anchor="start">36 wide × 23.25 deep</text><text x="60" y="337" font-size="22" fill="#243342" text-anchor="start">Front</text><text x="285" y="337" font-size="22" fill="#243342" text-anchor="start">× 1</text><text x="365" y="337" font-size="22" fill="#243342" text-anchor="start">36 wide × 35.25 high</text><text x="60" y="381" font-size="22" fill="#243342" text-anchor="start">Deck panels</text><text x="285" y="381" font-size="22" fill="#243342" text-anchor="start">× 2</text><text x="365" y="381" font-size="22" fill="#243342" text-anchor="start">35.75 wide × 19.2 deep</text><text x="60" y="470" font-size="19" fill="#243342" text-anchor="start">Cut full-width row blanks first; then rip each blank to its panel width.</text><text x="60" y="505" font-size="19" fill="#243342" text-anchor="start">Two sheets are required by panel area. This layout leaves trimming allowance.</text><text x="130" y="565" font-size="24" fill="#243342" text-anchor="start">Sheet A</text><rect x="130" y="610" width="230.39999999999998" height="460.79999999999995" fill="#f6f7f8" stroke="#647786" stroke-width="2" /><rect x="130" y="610" width="172.79999999999998" height="115.19999999999999" fill="#deedf3" stroke="#38566d" stroke-width="2" /><text x="216.39999999999998" y="662.6" font-size="16" fill="#243342" text-anchor="middle">Side 1</text><text x="216.39999999999998" y="685.6" font-size="15" fill="#243342" text-anchor="middle">36 × 24</text><rect x="130" y="725.8" width="172.79999999999998" height="115.19999999999999" fill="#deedf3" stroke="#38566d" stroke-width="2" /><text x="216.39999999999998" y="778.4" font-size="16" fill="#243342" text-anchor="middle">Side 2</text><text x="216.39999999999998" y="801.4" font-size="15" fill="#243342" text-anchor="middle">36 × 24</text><rect x="130" y="841.6" width="172.79999999999998" height="169.2" fill="#deedf3" stroke="#38566d" stroke-width="2" /><text x="216.39999999999998" y="921.2" font-size="16" fill="#243342" text-anchor="middle">Front</text><text x="216.39999999999998" y="944.2" font-size="15" fill="#243342" text-anchor="middle">36 × 35.25</text><line x1="130" y1="595" x2="360.4" y2="595" stroke="#38566d" stroke-width="2" class="dim"/><text x="245.2" y="585" font-size="19" fill="#243342" text-anchor="middle">48</text><line x1="108" y1="610" x2="108" y2="1070.8" stroke="#38566d" stroke-width="2" class="dim"/><text x="96" y="840.4" font-size="19" fill="#243342" text-anchor="end">96</text><text x="520" y="565" font-size="24" fill="#243342" text-anchor="start">Sheet B</text><rect x="520" y="610" width="230.39999999999998" height="460.79999999999995" fill="#f6f7f8" stroke="#647786" stroke-width="2" /><rect x="520" y="610" width="172.79999999999998" height="115.19999999999999" fill="#deedf3" stroke="#38566d" stroke-width="2" /><text x="606.4" y="662.6" font-size="16" fill="#243342" text-anchor="middle">Top</text><text x="606.4" y="685.6" font-size="15" fill="#243342" text-anchor="middle">36 × 24</text><rect x="520" y="725.8" width="172.79999999999998" height="111.6" fill="#deedf3" stroke="#38566d" stroke-width="2" /><text x="606.4" y="776.5999999999999" font-size="16" fill="#243342" text-anchor="middle">Bottom</text><text x="606.4" y="799.5999999999999" font-size="15" fill="#243342" text-anchor="middle">36 × 23.25</text><rect x="520" y="838" width="171.6" height="92.16" fill="#deedf3" stroke="#38566d" stroke-width="2" /><text x="605.8" y="879.08" font-size="16" fill="#243342" text-anchor="middle">Deck top</text><text x="605.8" y="902.08" font-size="15" fill="#243342" text-anchor="middle">35.75 × 19.2</text><rect x="520" y="930.76" width="171.6" height="92.16" fill="#deedf3" stroke="#38566d" stroke-width="2" /><text x="605.8" y="971.84" font-size="16" fill="#243342" text-anchor="middle">Deck bottom</text><text x="605.8" y="994.84" font-size="15" fill="#243342" text-anchor="middle">35.75 × 19.2</text><line x1="520" y1="595" x2="750.4" y2="595" stroke="#38566d" stroke-width="2" class="dim"/><text x="635.2" y="585" font-size="19" fill="#243342" text-anchor="middle">48</text><line x1="498" y1="610" x2="498" y2="1070.8" stroke="#38566d" stroke-width="2" class="dim"/><text x="486" y="840.4" font-size="19" fill="#243342" text-anchor="end">96</text><text x="900" y="655" font-size="21" fill="#243342" text-anchor="start">ROW LENGTHS INCLUDING KERFS</text><text x="900" y="700" font-size="21" fill="#243342" text-anchor="start">Sheet A: 83.50 of 96</text><text x="900" y="738" font-size="21" fill="#243342" text-anchor="start">Sheet B: 86.025 of 96</text><text x="900" y="800" font-size="18" fill="#243342" text-anchor="start">Blank areas are offcuts, not additional parts.</text><text x="900" y="838" font-size="18" fill="#243342" text-anchor="start">Allow for edge cleanup and actual blade kerf.</text><text x="900" y="876" font-size="18" fill="#243342" text-anchor="start">Keep the bottom deck panel solid.</text></svg>