<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:Arial,sans-serif}</style><rect width="1600" height="1300" fill="white"/><text x="55" y="60" font-size="34" fill="#263744" text-anchor="start">04 — DC power and controller connections</text><text x="55" y="102" font-size="20" fill="#263744" text-anchor="start">Three separate sources: computer USB for Mega, 5 V supply for collars, 12 V supply for valve coils.</text><text x="55" y="1265" font-size="17" fill="#687985" text-anchor="start">REVIEW • wiring relationships, not physical connector orientation • © 2026 crackpotgumption • CC BY 4.0</text><rect x="60" y="160" width="390" height="150" rx="8" fill="#edf4f8" stroke="#577283" stroke-width="2"/><text x="80" y="195" font-size="25" fill="#263744" text-anchor="start">Host computer</text><text x="80" y="232" font-size="20" fill="#263744" text-anchor="start">Runs Python; USB serial to Mega</text><text x="80" y="262" font-size="20" fill="#263744" text-anchor="start">USB speakers or other audio out</text><rect x="610" y="160" width="400" height="150" rx="8" fill="#edf4f8" stroke="#577283" stroke-width="2"/><text x="630" y="195" font-size="25" fill="#263744" text-anchor="start">Arduino Mega</text><text x="630" y="232" font-size="20" fill="#263744" text-anchor="start">USB-powered from host only</text><text x="630" y="262" font-size="20" fill="#263744" text-anchor="start">5 V logic; GND joins common DC ground</text><polyline points="450,230 610,230" fill="none" stroke="#4d798f" stroke-width="4"  marker-end="url(#arrow)"/><text x="490" y="210" font-size="20" fill="#263744" text-anchor="start">USB</text><rect x="1160" y="160" width="370" height="150" rx="8" fill="#edf4f8" stroke="#577283" stroke-width="2"/><text x="1180" y="195" font-size="25" fill="#263744" text-anchor="start">Driver logic / mux</text><text x="1180" y="232" font-size="20" fill="#263744" text-anchor="start">Both supplied by dedicated 5 V rail</text><text x="1180" y="262" font-size="20" fill="#263744" text-anchor="start">Common ground with Mega</text><polyline points="1080,470 1080,235 1160,235" fill="none" stroke="#b66a18" stroke-width="4"  marker-end="url(#arrow)"/><text x="1095" y="330" font-size="18" fill="#263744" text-anchor="start">+5 V</text><rect x="60" y="390" width="390" height="160" rx="8" fill="#fff2df" stroke="#577283" stroke-width="2"/><text x="80" y="425" font-size="25" fill="#263744" text-anchor="start">5 V, 10 A supply</text><text x="80" y="462" font-size="20" fill="#263744" text-anchor="start">+5 V → master 5 V block</text><text x="80" y="492" font-size="20" fill="#263744" text-anchor="start">0 V → master ground block</text><rect x="610" y="390" width="400" height="160" rx="8" fill="#fff2df" stroke="#577283" stroke-width="2"/><text x="630" y="425" font-size="25" fill="#263744" text-anchor="start">Deck 5 V / GND buses</text><text x="630" y="462" font-size="20" fill="#263744" text-anchor="start">18 AWG feeders from master blocks</text><text x="630" y="492" font-size="20" fill="#263744" text-anchor="start">22 AWG general wiring as used</text><rect x="1160" y="390" width="370" height="160" rx="8" fill="#fff2df" stroke="#577283" stroke-width="2"/><text x="1180" y="425" font-size="25" fill="#263744" text-anchor="start">Five NeoPixel collars</text><text x="1180" y="462" font-size="20" fill="#263744" text-anchor="start">+5 V and GND from deck buses</text><text x="1180" y="492" font-size="20" fill="#263744" text-anchor="start">19 pixels each; 95 total</text><polyline points="450,470 610,470" fill="none" stroke="#b66a18" stroke-width="4"  marker-end="url(#arrow)"/><polyline points="1010,470 1160,470" fill="none" stroke="#b66a18" stroke-width="4"  marker-end="url(#arrow)"/><rect x="60" y="640" width="390" height="160" rx="8" fill="#fce9e6" stroke="#577283" stroke-width="2"/><text x="80" y="675" font-size="25" fill="#263744" text-anchor="start">12 V, 5 A supply</text><text x="80" y="712" font-size="20" fill="#263744" text-anchor="start">+12 V → master 12 V block</text><text x="80" y="742" font-size="20" fill="#263744" text-anchor="start">0 V → master ground block</text><rect x="610" y="640" width="400" height="160" rx="8" fill="#fce9e6" stroke="#577283" stroke-width="2"/><text x="630" y="675" font-size="25" fill="#263744" text-anchor="start">Adafruit #6318 driver</text><text x="630" y="712" font-size="20" fill="#263744" text-anchor="start">Coil-power V+ ← +12 V</text><text x="630" y="742" font-size="20" fill="#263744" text-anchor="start">Power GND ← common DC ground</text><rect x="1160" y="640" width="370" height="160" rx="8" fill="#fce9e6" stroke="#577283" stroke-width="2"/><text x="1180" y="675" font-size="25" fill="#263744" text-anchor="start">Five valve coils</text><text x="1180" y="712" font-size="20" fill="#263744" text-anchor="start">Each coil: board + to numbered output</text><text x="1180" y="742" font-size="20" fill="#263744" text-anchor="start">Outputs 0–4 match target IDs</text><polyline points="450,720 610,720" fill="none" stroke="#b24d3e" stroke-width="4"  marker-end="url(#arrow)"/><polyline points="1010,720 1160,720" fill="none" stroke="#b24d3e" stroke-width="4"  marker-end="url(#arrow)"/><rect x="60" y="890" width="1470" height="140" rx="8" fill="#e9edf0" stroke="#577283" stroke-width="2"/><text x="80" y="925" font-size="25" fill="#263744" text-anchor="start">Common DC ground</text><text x="80" y="962" font-size="20" fill="#263744" text-anchor="start">Join Mega GND, driver GND, mux/sensor grounds, LED grounds, and both supply 0 V returns.</text><text x="80" y="992" font-size="20" fill="#263744" text-anchor="start">Keep +5 V and +12 V positive rails separate. External collar supply does not feed Mega 5 V.</text><text x="60" y="1090" font-size="23" fill="#263744" text-anchor="start">Driver Vcc is logic power; driver V+ is coil power. They are different terminals.</text><text x="60" y="1130" font-size="21" fill="#8b4c22" text-anchor="start">MPU6050 breakout VCC inputs also use the dedicated 5 V rail.</text><text x="60" y="1170" font-size="20" fill="#263744" text-anchor="start">Compressor uses its separate AC connection. This drawing covers DC wiring, not mains installation.</text></svg>