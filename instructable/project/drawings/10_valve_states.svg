<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250"><style>text{font-family:Arial,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1800" height="1250" fill="white"/><text x="55" y="55" font-size="32" fill="#263744" text-anchor="start">10 — One channel: valve states and exhaust paths</text><text x="55" y="96" font-size="20" fill="#263744" text-anchor="start">Functional routing for each target. Identify connections by function rather than assuming the valve’s printed port letters.</text><text x="55" y="1225" font-size="17" fill="#687985" text-anchor="start">REVIEW • functional port labels, not physical valve-port placement • © 2026 crackpotgumption • CC BY 4.0</text><rect x="70" y="170" width="1650" height="115" rx="5" fill="#f4f7f9" stroke="#526b7a" stroke-width="2"/><text x="95" y="207" font-size="26" fill="#263744" text-anchor="start">SUPPLY: regulated compressor → manifold → valve supply port</text><text x="95" y="253" font-size="22" fill="#263744" text-anchor="start">Quarter-inch OD tubing throughout; linked push fittings and cylinder-supplied fittings.</text><rect x="70" y="365" width="720" height="625" rx="5" fill="#f4f7f9" stroke="#526b7a" stroke-width="2"/><text x="95" y="410" font-size="29" fill="#263744" text-anchor="start">OFF — coil de-energized</text><rect x="100" y="475" width="300" height="180" rx="5" fill="#e6f0f5" stroke="#526b7a" stroke-width="2"/><text x="118" y="510" font-size="21" fill="#263744" text-anchor="start">5/2 DIRECTIONAL VALVE</text><text x="118" y="550" font-size="23" fill="#263744" text-anchor="start">Supply → TOP</text><text x="118" y="590" font-size="23" fill="#263744" text-anchor="start">BOTTOM → exhaust</text><rect x="510" y="495" width="175" height="240" rx="5" fill="#f0f6f9" stroke="#526b7a" stroke-width="2"/><polyline points="522,706.2 673,706.2" fill="none" stroke="#303840" stroke-width="3" /><polyline points="597.5,706.2 597.5,483" fill="none" stroke="#303840" stroke-width="3" /><circle cx="510" cy="535" r="5" fill="white" stroke="#263744" stroke-width="2"/><circle cx="685" cy="695" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="598" y="785" font-size="19" fill="#263744" text-anchor="middle">DOUBLE-ACTING CYLINDER</text><circle cx="400" cy="520" r="5" fill="white" stroke="#263744" stroke-width="2"/><circle cx="400" cy="610" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="400,520 470,520 470,535 510,535" fill="none" stroke="#397a45" stroke-width="3" /><polyline points="400,610 725,610 725,695 685,695" fill="none" stroke="#705095" stroke-width="3" /><text x="485" y="475" font-size="19" fill="#397a45" text-anchor="start">TOP PORT</text><text x="675" y="740" font-size="18" fill="#705095" text-anchor="middle">BOTTOM PORT</text><polyline points="175,655 175,865" fill="none" stroke="#a36c2c" stroke-width="3" /><polyline points="325,655 325,865" fill="none" stroke="#a36c2c" stroke-width="3" /><rect x="130" y="825" width="90" height="45" rx="5" fill="#fff0dc" stroke="#526b7a" stroke-width="2"/><polyline points="142,858 208,837" fill="none" stroke="#a36c2c" stroke-width="3" marker-end="url(#arrow)"/><rect x="280" y="825" width="90" height="45" rx="5" fill="#fff0dc" stroke="#526b7a" stroke-width="2"/><polyline points="292,858 358,837" fill="none" stroke="#a36c2c" stroke-width="3" marker-end="url(#arrow)"/><text x="100" y="910" font-size="20" fill="#a36c2c" text-anchor="start">BESL-01 controls on both exhaust ports</text><text x="100" y="945" font-size="20" fill="#263744" text-anchor="start">Exhaust vents to atmosphere</text><rect x="950" y="365" width="720" height="625" rx="5" fill="#f4f7f9" stroke="#526b7a" stroke-width="2"/><text x="975" y="410" font-size="29" fill="#263744" text-anchor="start">ON — coil energized</text><rect x="980" y="475" width="300" height="180" rx="5" fill="#e6f0f5" stroke="#526b7a" stroke-width="2"/><text x="998" y="510" font-size="21" fill="#263744" text-anchor="start">5/2 DIRECTIONAL VALVE</text><text x="998" y="550" font-size="23" fill="#263744" text-anchor="start">Supply → BOTTOM</text><text x="998" y="590" font-size="23" fill="#263744" text-anchor="start">TOP → exhaust</text><rect x="1390" y="495" width="175" height="240" rx="5" fill="#f0f6f9" stroke="#526b7a" stroke-width="2"/><polyline points="1402,523.8 1553,523.8" fill="none" stroke="#303840" stroke-width="3" /><polyline points="1477.5,523.8 1477.5,380" fill="none" stroke="#303840" stroke-width="3" /><circle cx="1390" cy="535" r="5" fill="white" stroke="#263744" stroke-width="2"/><circle cx="1565" cy="695" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1478" y="785" font-size="19" fill="#263744" text-anchor="middle">DOUBLE-ACTING CYLINDER</text><circle cx="1280" cy="520" r="5" fill="white" stroke="#263744" stroke-width="2"/><circle cx="1280" cy="610" r="5" fill="white" stroke="#263744" stroke-width="2"/><polyline points="1280,520 1350,520 1350,535 1390,535" fill="none" stroke="#397a45" stroke-width="3" /><polyline points="1280,610 1605,610 1605,695 1565,695" fill="none" stroke="#705095" stroke-width="3" /><text x="1365" y="475" font-size="19" fill="#397a45" text-anchor="start">TOP PORT</text><text x="1555" y="740" font-size="18" fill="#705095" text-anchor="middle">BOTTOM PORT</text><polyline points="1055,655 1055,865" fill="none" stroke="#a36c2c" stroke-width="3" /><polyline points="1205,655 1205,865" fill="none" stroke="#a36c2c" stroke-width="3" /><rect x="1010" y="825" width="90" height="45" rx="5" fill="#fff0dc" stroke="#526b7a" stroke-width="2"/><polyline points="1022,858 1088,837" fill="none" stroke="#a36c2c" stroke-width="3" marker-end="url(#arrow)"/><rect x="1160" y="825" width="90" height="45" rx="5" fill="#fff0dc" stroke="#526b7a" stroke-width="2"/><polyline points="1172,858 1238,837" fill="none" stroke="#a36c2c" stroke-width="3" marker-end="url(#arrow)"/><text x="980" y="910" font-size="20" fill="#a36c2c" text-anchor="start">BESL-01 controls on both exhaust ports</text><text x="980" y="945" font-size="20" fill="#263744" text-anchor="start">Exhaust vents to atmosphere</text><text x="90" y="1065" font-size="25" fill="#263744" text-anchor="start">Air to the BOTTOM port extends the piston and raises the target (ON).</text><text x="90" y="1110" font-size="23" fill="#263744" text-anchor="start">Air to the TOP port retracts the piston and lowers the target (OFF); the opposite end exhausts.</text><text x="90" y="1150" font-size="21" fill="#263744" text-anchor="start">The piston symbol shows the resulting lowered / raised position. Five channels; ten exhaust controls.</text></svg>