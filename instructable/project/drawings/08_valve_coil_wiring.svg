<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400"><style>text{font-family:Arial,sans-serif}</style><rect width="1900" height="1400" fill="white"/><text x="55" y="55" font-size="33" fill="#263744" text-anchor="start">08 — Five 12 V valve coils and driver terminals</text><text x="55" y="95" font-size="20" fill="#263744" text-anchor="start">Wire each coil between its driver + terminal and matching numbered switched output. No coil connects to a Mega pin.</text><text x="55" y="1374" font-size="16" fill="#687985" text-anchor="start">REVIEW • dimensions/positions schematic • same net name = same wire network • dots = junctions • © 2026 crackpotgumption / CC BY 4.0</text><rect x="60" y="185" width="395" height="190" rx="5" fill="#fbeeea" stroke="#526b7a" stroke-width="2"/><text x="80" y="225" font-size="26" fill="#263744" text-anchor="start">12 V / 5 A supply</text><text x="80" y="270" font-size="22" fill="#263744" text-anchor="start">+12 V</text><text x="80" y="330" font-size="22" fill="#263744" text-anchor="start">0 V return</text><rect x="680" y="180" width="520" height="1050" rx="5" fill="#f4f7f9" stroke="#526b7a" stroke-width="2"/><text x="700" y="225" font-size="27" fill="#263744" text-anchor="start">ADAFRUIT #6318</text><text x="700" y="260" font-size="22" fill="#263744" text-anchor="start">Coil-power terminals</text><polyline points="455,280 680,280 780,280 780,1060" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="680" cy="280" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="700" y="310" font-size="19" fill="#263744" text-anchor="start">V+ / +12 V input</text><polyline points="455,340 560,340 560,1160 680,1160" fill="none" stroke="#303840" stroke-width="3" /><circle cx="680" cy="1160" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="700" y="1167" font-size="21" fill="#263744" text-anchor="start">GND</text><polyline points="560,1160 560,1178" fill="none" stroke="#303840" stroke-width="3" /><polyline points="542,1178 578,1178" fill="none" stroke="#303840" stroke-width="3" /><polyline points="549,1185 571,1185" fill="none" stroke="#303840" stroke-width="3" /><polyline points="556,1192 564,1192" fill="none" stroke="#303840" stroke-width="3" /><text x="400" y="1240" font-size="20" fill="#263744" text-anchor="start">DC_GND</text><text x="60" y="470" font-size="21" fill="#263744" text-anchor="start">Use the master 12 V and ground</text><text x="60" y="503" font-size="21" fill="#263744" text-anchor="start">distribution blocks on these runs.</text><polyline points="780,380 1200,380" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="780" cy="380" r="6" fill="#be4b35"/><circle cx="1200" cy="380" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1170" y="368" font-size="20" fill="#263744" text-anchor="end">+ / V+</text><polyline points="1200,380 1320,380 1320,420 1400,420" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="1200" cy="460" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1170" y="467" font-size="21" fill="#263744" text-anchor="end">0 / A0</text><polyline points="1200,460 1600,460 1600,420 1510,420" fill="none" stroke="#286e99" stroke-width="3" /><circle cx="1400" cy="420" r="5" fill="white" stroke="#263744" stroke-width="2"/><circle cx="1510" cy="420" r="5" fill="white" stroke="#263744" stroke-width="2"/><path d="M1400 420 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0" fill="none" stroke="#303840" stroke-width="3"/><text x="1455" y="368" font-size="21" fill="#263744" text-anchor="middle">VALVE 0 — 12 V COIL</text><polyline points="780,530 1200,530" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="780" cy="530" r="6" fill="#be4b35"/><circle cx="1200" cy="530" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1170" y="518" font-size="20" fill="#263744" text-anchor="end">+ / V+</text><polyline points="1200,530 1320,530 1320,570 1400,570" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="1200" cy="610" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1170" y="617" font-size="21" fill="#263744" text-anchor="end">1 / A1</text><polyline points="1200,610 1600,610 1600,570 1510,570" fill="none" stroke="#286e99" stroke-width="3" /><circle cx="1400" cy="570" r="5" fill="white" stroke="#263744" stroke-width="2"/><circle cx="1510" cy="570" r="5" fill="white" stroke="#263744" stroke-width="2"/><path d="M1400 570 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0" fill="none" stroke="#303840" stroke-width="3"/><text x="1455" y="518" font-size="21" fill="#263744" text-anchor="middle">VALVE 1 — 12 V COIL</text><polyline points="780,680 1200,680" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="780" cy="680" r="6" fill="#be4b35"/><circle cx="1200" cy="680" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1170" y="668" font-size="20" fill="#263744" text-anchor="end">+ / V+</text><polyline points="1200,680 1320,680 1320,720 1400,720" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="1200" cy="760" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1170" y="767" font-size="21" fill="#263744" text-anchor="end">2 / A2</text><polyline points="1200,760 1600,760 1600,720 1510,720" fill="none" stroke="#286e99" stroke-width="3" /><circle cx="1400" cy="720" r="5" fill="white" stroke="#263744" stroke-width="2"/><circle cx="1510" cy="720" r="5" fill="white" stroke="#263744" stroke-width="2"/><path d="M1400 720 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0" fill="none" stroke="#303840" stroke-width="3"/><text x="1455" y="668" font-size="21" fill="#263744" text-anchor="middle">VALVE 2 — 12 V COIL</text><polyline points="780,830 1200,830" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="780" cy="830" r="6" fill="#be4b35"/><circle cx="1200" cy="830" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1170" y="818" font-size="20" fill="#263744" text-anchor="end">+ / V+</text><polyline points="1200,830 1320,830 1320,870 1400,870" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="1200" cy="910" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1170" y="917" font-size="21" fill="#263744" text-anchor="end">3 / A3</text><polyline points="1200,910 1600,910 1600,870 1510,870" fill="none" stroke="#286e99" stroke-width="3" /><circle cx="1400" cy="870" r="5" fill="white" stroke="#263744" stroke-width="2"/><circle cx="1510" cy="870" r="5" fill="white" stroke="#263744" stroke-width="2"/><path d="M1400 870 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0" fill="none" stroke="#303840" stroke-width="3"/><text x="1455" y="818" font-size="21" fill="#263744" text-anchor="middle">VALVE 3 — 12 V COIL</text><polyline points="780,980 1200,980" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="780" cy="980" r="6" fill="#be4b35"/><circle cx="1200" cy="980" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1170" y="968" font-size="20" fill="#263744" text-anchor="end">+ / V+</text><polyline points="1200,980 1320,980 1320,1020 1400,1020" fill="none" stroke="#be4b35" stroke-width="3" /><circle cx="1200" cy="1060" r="5" fill="white" stroke="#263744" stroke-width="2"/><text x="1170" y="1067" font-size="21" fill="#263744" text-anchor="end">4 / A4</text><polyline points="1200,1060 1600,1060 1600,1020 1510,1020" fill="none" stroke="#286e99" stroke-width="3" /><circle cx="1400" cy="1020" r="5" fill="white" stroke="#263744" stroke-width="2"/><circle cx="1510" cy="1020" r="5" fill="white" stroke="#263744" stroke-width="2"/><path d="M1400 1020 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0 q 11 -38 22 0" fill="none" stroke="#303840" stroke-width="3"/><text x="1455" y="968" font-size="21" fill="#263744" text-anchor="middle">VALVE 4 — 12 V COIL</text><text x="700" y="1110" font-size="20" fill="#263744" text-anchor="start">Numbered outputs are switched coil returns.</text><text x="60" y="600" font-size="21" fill="#263744" text-anchor="start">Driver logic Vcc and SDA/SCL:</text><text x="60" y="633" font-size="21" fill="#263744" text-anchor="start">see sheet 06.</text><text x="60" y="710" font-size="20" fill="#263744" text-anchor="start">+ terminals share the board V+ supply.</text><text x="60" y="743" font-size="19" fill="#263744" text-anchor="start">Built-in output drivers / flyback protection.</text><text x="60" y="835" font-size="19" fill="#263744" text-anchor="start">Do not confuse rear A0–A4 output labels</text><text x="60" y="868" font-size="19" fill="#263744" text-anchor="start">with the separate I²C address jumpers.</text><text x="700" y="1280" font-size="23" fill="#263744" text-anchor="start">OFF / de-energized: valve routes air to the top of its cylinder.</text></svg>