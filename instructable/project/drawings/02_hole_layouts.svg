<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200"><style>text{font-family:Arial,sans-serif} .dim{marker-start:url(#arrow);marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38566d"/></marker></defs><rect width="1600" height="1200" fill="white"/><text x="60" y="65" font-size="34" fill="#243342" text-anchor="start">02 — Playfield and deck hole layouts</text><text x="60" y="105" font-size="19" fill="#243342" text-anchor="start">View from above. Each panel has its OWN front-left origin. Coordinates are (left-to-right, front-to-back).</text><text x="60" y="1170" font-size="17" fill="#697681" text-anchor="start">REVIEW DRAWING • 2026-10-14 • dimensions in inches • ¾-inch plywood • not a full-size drilling template</text><text x="150" y="197" font-size="25" fill="#243342" text-anchor="start">TOP / PLAYFIELD — 36 × 24</text><line x1="150" y1="238" x2="762" y2="238" stroke="#38566d" stroke-width="2" class="dim"/><text x="456" y="228" font-size="19" fill="#243342" text-anchor="middle">36 wide</text><rect x="150" y="265" width="612" height="408" fill="#eaf2f7" stroke="#38566d" stroke-width="2" /><line x1="122" y1="265" x2="122" y2="673" stroke="#38566d" stroke-width="2" class="dim"/><text x="110" y="469" font-size="19" fill="#243342" text-anchor="end">24 deep</text><circle cx="252" cy="571" r="72.25" fill="white" stroke="#337b91" stroke-width="2"/><line x1="244" y1="571" x2="260" y2="571" stroke="#337b91" stroke-width="2" /><line x1="252" y1="563" x2="252" y2="579" stroke="#337b91" stroke-width="2" /><text x="252" y="559" font-size="17" fill="#243342" text-anchor="middle">Target 0</text><text x="252" y="595" font-size="16" fill="#243342" text-anchor="middle">(6, 6)</text><circle cx="456" cy="571" r="72.25" fill="white" stroke="#337b91" stroke-width="2"/><line x1="448" y1="571" x2="464" y2="571" stroke="#337b91" stroke-width="2" /><line x1="456" y1="563" x2="456" y2="579" stroke="#337b91" stroke-width="2" /><text x="456" y="559" font-size="17" fill="#243342" text-anchor="middle">Target 1</text><text x="456" y="595" font-size="16" fill="#243342" text-anchor="middle">(18, 6)</text><circle cx="660" cy="571" r="72.25" fill="white" stroke="#337b91" stroke-width="2"/><line x1="652" y1="571" x2="668" y2="571" stroke="#337b91" stroke-width="2" /><line x1="660" y1="563" x2="660" y2="579" stroke="#337b91" stroke-width="2" /><text x="660" y="559" font-size="17" fill="#243342" text-anchor="middle">Target 2</text><text x="660" y="595" font-size="16" fill="#243342" text-anchor="middle">(30, 6)</text><circle cx="354" cy="367" r="72.25" fill="white" stroke="#337b91" stroke-width="2"/><line x1="346" y1="367" x2="362" y2="367" stroke="#337b91" stroke-width="2" /><line x1="354" y1="359" x2="354" y2="375" stroke="#337b91" stroke-width="2" /><text x="354" y="355" font-size="17" fill="#243342" text-anchor="middle">Target 3</text><text x="354" y="391" font-size="16" fill="#243342" text-anchor="middle">(12, 18)</text><circle cx="558" cy="367" r="72.25" fill="white" stroke="#337b91" stroke-width="2"/><line x1="550" y1="367" x2="566" y2="367" stroke="#337b91" stroke-width="2" /><line x1="558" y1="359" x2="558" y2="375" stroke="#337b91" stroke-width="2" /><text x="558" y="355" font-size="17" fill="#243342" text-anchor="middle">Target 4</text><text x="558" y="391" font-size="16" fill="#243342" text-anchor="middle">(24, 18)</text><circle cx="150" cy="673" r="5" fill="#b85130"/><text x="150" y="703" font-size="18" fill="#b85130" text-anchor="start">(0, 0) FRONT-LEFT</text><text x="456" y="258" font-size="16" fill="#697681" text-anchor="middle">BACK</text><text x="456" y="703" font-size="18" fill="#243342" text-anchor="middle">FRONT</text><text x="890" y="197" font-size="25" fill="#243342" text-anchor="start">UPPER DECK — 35.75 × 19.2</text><line x1="890" y1="238" x2="1497.75" y2="238" stroke="#38566d" stroke-width="2" class="dim"/><text x="1193.875" y="228" font-size="19" fill="#243342" text-anchor="middle">35.75 wide</text><rect x="890" y="265" width="607.75" height="326.4" fill="#eaf2f7" stroke="#38566d" stroke-width="2" /><line x1="862" y1="265" x2="862" y2="591.4" stroke="#38566d" stroke-width="2" class="dim"/><text x="850" y="428.2" font-size="19" fill="#243342" text-anchor="end">19.2 deep</text><circle cx="992" cy="527.65" r="36.125" fill="white" stroke="#337b91" stroke-width="2"/><line x1="984" y1="527.65" x2="1000" y2="527.65" stroke="#337b91" stroke-width="2" /><line x1="992" y1="519.65" x2="992" y2="535.65" stroke="#337b91" stroke-width="2" /><text x="992" y="515.65" font-size="17" fill="#243342" text-anchor="middle">Target 0</text><text x="992" y="551.65" font-size="16" fill="#243342" text-anchor="middle">(6, 3.75)</text><circle cx="1196" cy="527.65" r="36.125" fill="white" stroke="#337b91" stroke-width="2"/><line x1="1188" y1="527.65" x2="1204" y2="527.65" stroke="#337b91" stroke-width="2" /><line x1="1196" y1="519.65" x2="1196" y2="535.65" stroke="#337b91" stroke-width="2" /><text x="1196" y="515.65" font-size="17" fill="#243342" text-anchor="middle">Target 1</text><text x="1196" y="551.65" font-size="16" fill="#243342" text-anchor="middle">(18, 3.75)</text><circle cx="1400" cy="527.65" r="36.125" fill="white" stroke="#337b91" stroke-width="2"/><line x1="1392" y1="527.65" x2="1408" y2="527.65" stroke="#337b91" stroke-width="2" /><line x1="1400" y1="519.65" x2="1400" y2="535.65" stroke="#337b91" stroke-width="2" /><text x="1400" y="515.65" font-size="17" fill="#243342" text-anchor="middle">Target 2</text><text x="1400" y="551.65" font-size="16" fill="#243342" text-anchor="middle">(30, 3.75)</text><circle cx="1094" cy="323.65" r="36.125" fill="white" stroke="#337b91" stroke-width="2"/><line x1="1086" y1="323.65" x2="1102" y2="323.65" stroke="#337b91" stroke-width="2" /><line x1="1094" y1="315.65" x2="1094" y2="331.65" stroke="#337b91" stroke-width="2" /><text x="1094" y="311.65" font-size="17" fill="#243342" text-anchor="middle">Target 3</text><text x="1094" y="347.65" font-size="16" fill="#243342" text-anchor="middle">(12, 15.75)</text><circle cx="1298" cy="323.65" r="36.125" fill="white" stroke="#337b91" stroke-width="2"/><line x1="1290" y1="323.65" x2="1306" y2="323.65" stroke="#337b91" stroke-width="2" /><line x1="1298" y1="315.65" x2="1298" y2="331.65" stroke="#337b91" stroke-width="2" /><text x="1298" y="311.65" font-size="17" fill="#243342" text-anchor="middle">Target 4</text><text x="1298" y="347.65" font-size="16" fill="#243342" text-anchor="middle">(24, 15.75)</text><circle cx="890" cy="591.4" r="5" fill="#b85130"/><text x="890" y="621.4" font-size="18" fill="#b85130" text-anchor="start">(0, 0) FRONT-LEFT</text><text x="1193.875" y="258" font-size="16" fill="#697681" text-anchor="middle">BACK</text><text x="1193.875" y="621.4" font-size="18" fill="#243342" text-anchor="middle">FRONT</text><text x="110" y="790" font-size="23" fill="#243342" text-anchor="start">Playfield: five Ø8.5 cut openings.</text><text x="890" y="790" font-size="23" fill="#243342" text-anchor="start">Deck: five approximately Ø4.25 openings.</text><text x="110" y="830" font-size="18" fill="#243342" text-anchor="start">Printed collars reduce the clear aperture.</text><text x="890" y="830" font-size="18" fill="#243342" text-anchor="start">Check fit against Oatey 435032 before batch cutting.</text><text x="110" y="910" font-size="24" fill="#243342" text-anchor="start">PLACEMENT: center the pneumatic deck between the cabinet rails.</text><text x="110" y="952" font-size="21" fill="#243342" text-anchor="start">The different depth coordinates account for the different front-left origins.</text><text x="110" y="990" font-size="21" fill="#243342" text-anchor="start">Do not add a separate rearward placement offset. Use the recorded coordinates for each panel.</text><text x="110" y="1050" font-size="18" fill="#8b4c22" text-anchor="start">Review detail: deck width is ¼ inch less than the playfield width; both recorded X layouts are unchanged.</text><text x="110" y="1082" font-size="18" fill="#8b4c22" text-anchor="start">This drawing does not invent a horizontal centering correction for the hole coordinates.</text></svg>