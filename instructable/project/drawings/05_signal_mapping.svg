<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font-family:Arial,sans-serif}</style><rect width="1600" height="1300" fill="white"/><text x="55" y="60" font-size="34" fill="#263744" text-anchor="start">05 — Signals, channel mapping and one target</text><text x="55" y="102" font-size="20" fill="#263744" text-anchor="start">Target numbers stay identical across driver outputs, mux channels and independent LED-data runs.</text><text x="55" y="1265" font-size="17" fill="#687985" text-anchor="start">REVIEW • wiring relationships, not physical connector orientation • © 2026 crackpotgumption • CC BY 4.0</text><rect x="60" y="165" width="430" height="185" rx="8" fill="#edf4f8" stroke="#577283" stroke-width="2"/><text x="80" y="200" font-size="25" fill="#263744" text-anchor="start">Arduino Mega</text><text x="80" y="237" font-size="20" fill="#263744" text-anchor="start">D20 / SDA → driver SDA and mux SDA</text><text x="80" y="267" font-size="20" fill="#263744" text-anchor="start">D21 / SCL → driver SCL and mux SCL</text><text x="80" y="297" font-size="20" fill="#263744" text-anchor="start">D24 → normally-open Start → GND</text><text x="80" y="327" font-size="20" fill="#263744" text-anchor="start">D24 configured INPUT_PULLUP</text><rect x="650" y="165" width="400" height="185" rx="8" fill="#edf4f8" stroke="#577283" stroke-width="2"/><text x="670" y="200" font-size="25" fill="#263744" text-anchor="start">Adafruit #6318</text><text x="670" y="237" font-size="20" fill="#263744" text-anchor="start">I²C address 0x20; logic Vcc = 5 V</text><text x="670" y="267" font-size="20" fill="#263744" text-anchor="start">Numbered outputs 0–4 → coil returns</text><text x="670" y="297" font-size="20" fill="#263744" text-anchor="start">Board + terminals → coil positives</text><text x="670" y="327" font-size="20" fill="#263744" text-anchor="start">GPIO B pins are not the coil outputs</text><polyline points="490,220 650,220" fill="none" stroke="#4d798f" stroke-width="4"  marker-end="url(#arrow)"/><text x="535" y="200" font-size="20" fill="#263744" text-anchor="start">I²C</text><rect x="650" y="395" width="400" height="165" rx="8" fill="#edf4f8" stroke="#577283" stroke-width="2"/><text x="670" y="430" font-size="25" fill="#263744" text-anchor="start">TCA9548A mux</text><text x="670" y="467" font-size="20" fill="#263744" text-anchor="start">I²C address 0x70</text><text x="670" y="497" font-size="20" fill="#263744" text-anchor="start">SD0/SC0 … SD4/SC4 → sensors</text><text x="670" y="527" font-size="20" fill="#263744" text-anchor="start">Channels 5–7 unused</text><polyline points="490,285 550,285 550,450 650,450" fill="none" stroke="#4d798f" stroke-width="4"  marker-end="url(#arrow)"/><text x="565" y="420" font-size="20" fill="#263744" text-anchor="start">I²C</text><rect x="1160" y="395" width="370" height="165" rx="8" fill="#edf4f8" stroke="#577283" stroke-width="2"/><text x="1180" y="430" font-size="25" fill="#263744" text-anchor="start">Five MPU6050 boards</text><text x="1180" y="467" font-size="20" fill="#263744" text-anchor="start">One sensor on each mux channel</text><text x="1180" y="497" font-size="20" fill="#263744" text-anchor="start">Each at 0x68; AD0 low</text><text x="1180" y="527" font-size="20" fill="#263744" text-anchor="start">Mount each with Y axis vertical</text><polyline points="1050,470 1160,470" fill="none" stroke="#4d798f" stroke-width="4"  marker-end="url(#arrow)"/><text x="1075" y="450" font-size="17" fill="#263744" text-anchor="start">SDA/SCL</text><rect x="60" y="395" width="430" height="165" rx="8" fill="#edf4f8" stroke="#577283" stroke-width="2"/><text x="80" y="430" font-size="25" fill="#263744" text-anchor="start">LED data is independent</text><text x="80" y="467" font-size="20" fill="#263744" text-anchor="start">D14 … D18 → collars 0 … 4 DIN</text><text x="80" y="497" font-size="20" fill="#263744" text-anchor="start">Each collar has 19 pixels</text><text x="80" y="527" font-size="20" fill="#263744" text-anchor="start">5 V / GND from deck buses (sheet 04)</text><text x="60" y="640" font-size="25" fill="#263744" text-anchor="start">TARGET CONNECTION TABLE</text><rect x="60" y="670" width="200" height="53" fill="#d9e8f0" stroke="#c5d1d9"/><text x="72" y="703" font-size="19" fill="#263744" text-anchor="start">Target</text><rect x="260" y="670" width="270" height="53" fill="#d9e8f0" stroke="#c5d1d9"/><text x="272" y="703" font-size="19" fill="#263744" text-anchor="start">Mega → collar DIN</text><rect x="530" y="670" width="290" height="53" fill="#d9e8f0" stroke="#c5d1d9"/><text x="542" y="703" font-size="19" fill="#263744" text-anchor="start">Mux → sensor</text><rect x="820" y="670" width="300" height="53" fill="#d9e8f0" stroke="#c5d1d9"/><text x="832" y="703" font-size="19" fill="#263744" text-anchor="start">Driver → coil return</text><rect x="1120" y="670" width="410" height="53" fill="#d9e8f0" stroke="#c5d1d9"/><text x="1132" y="703" font-size="19" fill="#263744" text-anchor="start">Physical position</text><rect x="60" y="723" width="200" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="72" y="756" font-size="21" fill="#263744" text-anchor="start">0</text><rect x="260" y="723" width="270" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="272" y="756" font-size="21" fill="#263744" text-anchor="start">D14</text><rect x="530" y="723" width="290" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="542" y="756" font-size="21" fill="#263744" text-anchor="start">SD0 / SC0</text><rect x="820" y="723" width="300" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="832" y="756" font-size="21" fill="#263744" text-anchor="start">0 (A0 on rear)</text><rect x="1120" y="723" width="410" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="1132" y="756" font-size="21" fill="#263744" text-anchor="start">Front left</text><rect x="60" y="776" width="200" height="53" fill="white" stroke="#c5d1d9"/><text x="72" y="809" font-size="21" fill="#263744" text-anchor="start">1</text><rect x="260" y="776" width="270" height="53" fill="white" stroke="#c5d1d9"/><text x="272" y="809" font-size="21" fill="#263744" text-anchor="start">D15</text><rect x="530" y="776" width="290" height="53" fill="white" stroke="#c5d1d9"/><text x="542" y="809" font-size="21" fill="#263744" text-anchor="start">SD1 / SC1</text><rect x="820" y="776" width="300" height="53" fill="white" stroke="#c5d1d9"/><text x="832" y="809" font-size="21" fill="#263744" text-anchor="start">1 (A1 on rear)</text><rect x="1120" y="776" width="410" height="53" fill="white" stroke="#c5d1d9"/><text x="1132" y="809" font-size="21" fill="#263744" text-anchor="start">Front center</text><rect x="60" y="829" width="200" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="72" y="862" font-size="21" fill="#263744" text-anchor="start">2</text><rect x="260" y="829" width="270" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="272" y="862" font-size="21" fill="#263744" text-anchor="start">D16</text><rect x="530" y="829" width="290" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="542" y="862" font-size="21" fill="#263744" text-anchor="start">SD2 / SC2</text><rect x="820" y="829" width="300" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="832" y="862" font-size="21" fill="#263744" text-anchor="start">2 (A2 on rear)</text><rect x="1120" y="829" width="410" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="1132" y="862" font-size="21" fill="#263744" text-anchor="start">Front right</text><rect x="60" y="882" width="200" height="53" fill="white" stroke="#c5d1d9"/><text x="72" y="915" font-size="21" fill="#263744" text-anchor="start">3</text><rect x="260" y="882" width="270" height="53" fill="white" stroke="#c5d1d9"/><text x="272" y="915" font-size="21" fill="#263744" text-anchor="start">D17</text><rect x="530" y="882" width="290" height="53" fill="white" stroke="#c5d1d9"/><text x="542" y="915" font-size="21" fill="#263744" text-anchor="start">SD3 / SC3</text><rect x="820" y="882" width="300" height="53" fill="white" stroke="#c5d1d9"/><text x="832" y="915" font-size="21" fill="#263744" text-anchor="start">3 (A3 on rear)</text><rect x="1120" y="882" width="410" height="53" fill="white" stroke="#c5d1d9"/><text x="1132" y="915" font-size="21" fill="#263744" text-anchor="start">Rear left</text><rect x="60" y="935" width="200" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="72" y="968" font-size="21" fill="#263744" text-anchor="start">4</text><rect x="260" y="935" width="270" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="272" y="968" font-size="21" fill="#263744" text-anchor="start">D18</text><rect x="530" y="935" width="290" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="542" y="968" font-size="21" fill="#263744" text-anchor="start">SD4 / SC4</text><rect x="820" y="935" width="300" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="832" y="968" font-size="21" fill="#263744" text-anchor="start">4 (A4 on rear)</text><rect x="1120" y="935" width="410" height="53" fill="#f4f7f9" stroke="#c5d1d9"/><text x="1132" y="968" font-size="21" fill="#263744" text-anchor="start">Rear right</text><text x="60" y="1050" font-size="23" fill="#8b4c22" text-anchor="start">SENSOR INTERFACE — review boundary</text><text x="60" y="1088" font-size="20" fill="#8b4c22" text-anchor="start">Driver, mux and MPU6050 breakout power all comes from the dedicated 5 V rail.</text><text x="60" y="1124" font-size="20" fill="#8b4c22" text-anchor="start">Do not infer 5 V sensor tolerance from the Mega or from a different vendor’s breakout. Grounds are common.</text><text x="60" y="1170" font-size="19" fill="#263744" text-anchor="start">NeoPixel series data resistors / supply capacitor are guidance additions; not shown as confirmed installed parts.</text></svg>